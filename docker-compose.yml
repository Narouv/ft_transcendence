
services:
  postgres:
    container_name: postgres
    image: postgres:latest
    init: true
    env_file:
      - .env
    environment:
      - PGDATA=/var/lib/postgresql/data/pgdata
    networks:
      - p-net
    volumes:
      - ./srcs/pgdata:/var/lib/postgresql/data
      #- db-stor:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d ${POSTGRES_DB} -U ${POSTGRES_USER}"]
      interval: 1s
      timeout: 5s
      retries: 20
  backend:
    container_name: backend
    image: backend
    build: './srcs/backend/.'
    init: true
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - p-net
      - w-net
    volumes:
      - ./srcs/backend/django-app:/var/django-site
  webserver:
    container_name: nginx
    image: nginx
    init: true
    volumes:
      - ${PWD}/srcs/nginx/config/nginx.conf:/etc/nginx/nginx.conf
      - ${PWD}/srcs/nginx/certs:/etc/ssl/certs
      - ${PWD}/srcs/backend/django-app/static:/data/www/static
      - ${PWD}/srcs/backend/django-app/media:/data/www/media
    ports:
    - "8080:80"
    - "8001:443"
    networks:
      - w-net
    depends_on:
      backend:
        condition: service_started
  redis:
    container_name: redis
    image: redis:7
    init: true
    networks:
      - p-net

networks:
  p-net:
    driver: bridge
  w-net:
    driver: bridge

