{% extends "webclient/views/content-window.html" %}
{% load profile_tags %}

{% block content %}
<div class="container">
  <div class="row m-5">
    <div class="col m-0 px-2 py-1">
      <div class="row m-0 px-0 py-1">
        {% display_player_profile %}
      </div>
      <div class="row m-0 px-0 py-2">
        {% display_player_stats %}
      </div>
    </div>
    <div class="col m-0 px-2 py-1">
      <div class="row m-0 px-0 py-1">
        {% display_match_history %}
      </div>
    </div>
    <div class="col m-0 px-2 py-1">
      <div class="row m-0 px-0 py-1">
        {% include "../snippets/friend-list.html" %}
      </div>
    </div>
  </div>
</div>
{% endblock %}
