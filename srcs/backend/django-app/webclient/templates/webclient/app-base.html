<!DOCTYPE html>
<html >
	{% comment %} data-bs-theme="dark" {% endcomment %}
	<head>
		{% load static %}
		<meta charset="utf-8">
		<meta http-equiv="X-UA-Compatible" content="IE=edge">
		<title>ft_transcendence</title>
		<meta name="description" content="">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
		<link rel="stylesheet" href="{% static 'style/app-base.css' %}">
		<link rel="stylesheet" href="{% static 'style/navbar.css' %}">
		<link rel="stylesheet" href="{% static 'style/content-window.css' %}">
		<link rel="stylesheet" href="{% static 'style/login.css' %}">
		<link rel="stylesheet" href="{% static 'style/profile.css' %}">
		<link rel="stylesheet" href="{% static 'style/gameselection.css' %}">
		<link rel="stylesheet" href="{% static 'style/settings.css' %}">
		<link rel="stylesheet" href="{% static 'style/game.css' %}">
		<link rel="stylesheet" href="{% static 'tpong/pong-game.css' %}">
	</head>

	<body>
		<section id="navbar">
			{% include "./views/navbar.html" %}
		</section>

		<div class="container">
			<section id="content">
			</section>
		</div>

		<div class="modal fade" id="disable2FAModal" tabindex="-1" aria-labelledby="disable-2fa-modal-label" aria-hidden="true">
			<div class="modal-dialog">
				<div class="modal-content">
					<div class="modal-header">
						<h1 class="modal-title fs-5 text-dark" id="disable-2fa-modal-label">Disable 2FA</h1>
						<button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
					</div>
					<div class="modal-body">
						<div id="disable-2fa-modal-label-text">
							<span class="text-dark">
								Are you sure you want to disable 2FA?
							</span>
						</div>
					</div>
					<div class="modal-footer">
						<button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
						<button type="button" class="btn btn-danger" onclick="profileSettings.toggle2FA(true)" data-bs-dismiss="modal">Yes, disable 2FA</button>
					</div>
				</div>
			</div>
		</div>
		<div class="modal fade" id="deleteFriendModal" tabindex="-1" aria-labelledby="delete-friend-modal-label" aria-hidden="true">
		<div class="modal-dialog">
			<div class="modal-content">
			<div class="modal-header">
				<h1 class="modal-title fs-5 text-dark" id="delete-friend-modal-label">Delete friend</h1>
				<button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
			</div>
			<div class="modal-body">
				<div id="delete-friend-modal-text" class="text-dark">
		
				</div>
			</div>
			<div class="modal-footer">
				<button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
				<button type="button" class="btn btn-danger" data-bs-dismiss="modal">Unfriend</button>
			</div>
			</div>
		</div>
		</div>
		<script src="{% static 'webclient/setup.js' %}" async type='module'></script>
		<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
	</body>
</html>
